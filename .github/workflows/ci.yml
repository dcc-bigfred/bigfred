name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install rsvg-convert (function icon rasterization)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Run web tests
        working-directory: web
        run: npm test

  build:
    name: Build (linux/amd64, linux/arm64, linux/armv7, android/arm64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install rsvg-convert (function icon rasterization)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build embedded SPA (required for -tags prod)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/loco-server-linux-amd64 ./pkgs/bigfred/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/bigfred-remote-icmp-linux-amd64 ./pkgs/bigfred/remote-icmp
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/loco-linux-amd64 ./pkgs/loco
          GOOS=linux GOARCH=amd64 go build -o dist/rb-linux-amd64 ./pkgs/rb/main.go

          # Raspberry Pi 5 (BCM2712, Cortex-A76) — linux/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/loco-server-linux-arm64 ./pkgs/bigfred/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/bigfred-remote-icmp-linux-arm64 ./pkgs/bigfred/remote-icmp
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/loco-linux-arm64 ./pkgs/loco
          GOOS=linux GOARCH=arm64 go build -o dist/rb-linux-arm64 ./pkgs/rb/main.go

          # Raspberry Pi 2 (BCM2836, Cortex-A7) — linux/arm, GOARM=7
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o dist/loco-server-linux-armv7 ./pkgs/bigfred/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o dist/bigfred-remote-icmp-linux-armv7 ./pkgs/bigfred/remote-icmp
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o dist/loco-linux-armv7 ./pkgs/loco
          GOOS=linux GOARCH=arm GOARM=7 go build -o dist/rb-linux-armv7 ./pkgs/rb/main.go

          # Android arm64 — rebuild SPA with phone capabilities, then embed
          (cd web && VITE_ANDROID=1 npm run build)
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -tags prod -ldflags="-s -w" \
            -o dist/loco-server-android-arm64 ./pkgs/bigfred/server

      - name: Report binary sizes
        run: |
          set -euo pipefail
          ls -lh dist/
          echo "loco-server-android-arm64: $(wc -c < dist/loco-server-android-arm64) bytes"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-oci:
    name: Publish loco-server to GHCR (ORAS)
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish loco-server-android-arm64
        run: ./scripts/publish-oci-loco-android.sh dist/loco-server-android-arm64
