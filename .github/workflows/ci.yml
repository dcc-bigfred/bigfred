name: CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Smoke-test minisign-sign
        env:
          GOPROXY: direct
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          go mod init smoke-test
          go get -t github.com/dcc-bigfred/common/internal/minisignsign@latest
          go test -count=1 github.com/dcc-bigfred/common/internal/minisignsign

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install rsvg-convert (function icon rasterization)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Run web tests
        working-directory: web
        run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            android_spa: "0"
          - name: arm64
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            android_spa: "0"
          - name: android-arm64
            goos: android
            goarch: arm64
            suffix: android-arm64
            android_spa: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install rsvg-convert (function icon rasterization)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build embedded SPA (required for -tags prod)
        working-directory: web
        env:
          ANDROID_SPA: ${{ matrix.android_spa }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          if [ "${ANDROID_SPA}" = "1" ]; then
            VITE_ANDROID=1 npm run build
          else
            npm run build
          fi

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
          ANDROID_SPA: ${{ matrix.android_spa }}
        run: |
          set -euo pipefail
          mkdir -p dist

          COMMIT="${GITHUB_SHA::7}"
          BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION_PKG="github.com/keskad/loco/pkgs/bigfred/server/version"
          LDFLAGS="-X ${VERSION_PKG}.buildCommit=${COMMIT} -X ${VERSION_PKG}.buildTime=${BUILDTIME}"

          CGO_ENABLED=0 go build -tags prod -ldflags="-s -w ${LDFLAGS}" \
            -o "dist/loco-server-${SUFFIX}" ./pkgs/bigfred/server

          if [ "${ANDROID_SPA}" != "1" ]; then
            CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o "dist/bf-${SUFFIX}" ./pkgs/bigfred/bf
            CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o "dist/bigfred-remote-icmp-${SUFFIX}" ./pkgs/bigfred/remote-icmp
            CGO_ENABLED=0 go build -o "dist/loco-${SUFFIX}" ./pkgs/loco
            go build -o "dist/rb-${SUFFIX}" ./pkgs/rb/main.go
          fi

          (
            cd dist
            sha256sum -- * > "../SHA256SUMS.${{ matrix.name }}"
            mv -f "../SHA256SUMS.${{ matrix.name }}" "SHA256SUMS.${{ matrix.name }}"
          )

      - name: Report binary sizes
        run: ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
