name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for CI build artifacts
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          DEADLINE=$(( $(date +%s) + 600 ))
          RUN_ID=""

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUN_JSON="$(gh run list --workflow=ci.yml --commit="$SHA" --limit=1 --json databaseId,status,conclusion)"
            if [ "$RUN_JSON" = "[]" ]; then
              echo "CI workflow run for ${SHA} not found yet; retrying..."
              sleep 15
              continue
            fi

            STATUS="$(echo "$RUN_JSON" | jq -r '.[0].status')"
            CONCLUSION="$(echo "$RUN_JSON" | jq -r '.[0].conclusion')"
            RUN_ID="$(echo "$RUN_JSON" | jq -r '.[0].databaseId')"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "CI workflow run ${RUN_ID} finished with conclusion: ${CONCLUSION}"
                exit 1
              fi
              echo "CI workflow run ${RUN_ID} succeeded"
              echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "CI workflow run ${RUN_ID} status=${STATUS}; waiting..."
            sleep 15
          done

          echo "Timed out after 10 minutes waiting for CI workflow on commit ${SHA}"
          exit 1

      - name: Download CI binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.ci.outputs.run_id }}" \
            --name binaries \
            --dir release-assets

      - name: Inject release version into ELF binaries
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::7}"
          find release-assets -type f -print0 | while IFS= read -r -d '' f; do
            # Only ELF binaries carry the section (skip .exe if present).
            if file -b "$f" | grep -qi 'ELF'; then
              ./scripts/inject-elf-version.sh "$f" "$TAG" "$COMMIT"
            else
              echo "skip (not ELF): $f"
            fi
          done

      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign release binaries with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "error: MINISIGN_SECRET_KEY secret is required (fail-closed)" >&2
            exit 1
          fi
          mapfile -d '' FILES < <(find release-assets -type f ! -name '*.minisig' -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No files to sign"
            exit 1
          fi
          # Signs and verifies each artifact against committed minisign.pub.
          ./scripts/minisign-sign.sh "${FILES[@]}"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          else
            echo "Release ${TAG} already exists"
          fi

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -d '' FILES < <(find release-assets -type f -print0)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          gh release upload "$TAG" "${FILES[@]}" --clobber

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag loco-server Android OCI artifact from main
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: ./scripts/retag-oci-loco-android.sh "${GITHUB_REF_NAME}"

      - name: Retag hub linux/arm64 OCI artifact from master
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: ./scripts/retag-oci-bigfred-hub.sh "${GITHUB_REF_NAME}"
